<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dentist Appointment</title>
    <link rel="stylesheet" href="./styles/login.css">
</head>
<body>
    <main>
        <header>
            <h1>Welcome to ChatDentist</h1>
            <h2>Because every chat start with a smile</h2>
        </header>

        <form action="LoginServlet">
            <div class="input_container">
                <p>Wrong username or password</p>
                <input type="text" name="email" required placeholder="Enter email here...">
                <input type="password" name="password" required placeholder="Enter password here...">
            </div>

            <button type="submit">Login</button>
        </form>

    </main>
    <img src="./assets/imgs/cover-pic.jpg" alt="Image of a pre-teen boy smiling at the dentist office">
</body>
</html>
